name: Generate GitHub Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: the-sauravkumar/metrics@master
        with:
          # Uses your Personal Access Token for extended API access
          token: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || github.token }}
          filename: github-metrics.svg
          
          # Base Configuration
          user: the-sauravkumar
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # 🈷️ Languages Activity
          # Displays your most used languages in a clean progress bar
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, shell
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # 📅 Isometric Commit Calendar
          # Replaces the flat 2D GitHub grid with a cool 3D skyline graph
          plugin_isocalendar: yes
          plugin_isocalendar_main: half
          
          # 👨‍💻 Lines of Code Tracking
          # Shows the total amount of code you've written and deleted
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          
          # 💡 Coding Habits & Activity
          # Generates charts showing your most productive times of day and active days
          plugin_habits: no
          
          # 🎩 Notable Contributions
          # Highlights Pull Requests and Commits you've made to popular external repositories
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes

          # 🌟 Recently Starred
          # Highlights 4 recently starred repositories to show your current tech interests
          plugin_stars: yes
          plugin_stars_limit: 4
