name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Prefer a PAT in METRICS_TOKEN (repo + read:user) for richer plugins.
          token: ${{ secrets.METRICS_TOKEN != '' && secrets.METRICS_TOKEN || github.token }}
          filename: github-metrics.svg
          
          # Basic configuration
          user: the-sauravkumar
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # 🈷️ Languages plugin
          plugin_languages: yes
          plugin_languages_ignored: html, css # Optional: Ignore markup/styling
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # 🏆 Achievements plugin (Acts like Trophies)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: X # Also shows locked achievements so section is always visible
